server {
    listen 80;
    server_name amiblu_rtc.byst.re;  # or _ if you want a catch-all

    # Serve the React build
    root /usr/share/nginx/html;
    index index.html;

    # Normal React routing: anything not starting with /api goes to index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy calls from /api/... to the backend container on port 5000
    location /api/ {
        proxy_pass http://backend:5000/;
        # Optionally pass some extra headers or set X-Forwarded-For if needed
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
